<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" font-family="-apple-system, Inter, Helvetica, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker>
  </defs>
  <rect x="0" y="0" width="900" height="300" rx="16" fill="#0f1115"/>
  <!-- host -->
  <rect x="330" y="30" width="400" height="240" rx="14" fill="#181b22" stroke="#262a33"/>
  <text x="530" y="56" text-anchor="middle" fill="#9ca3af" font-size="12" letter-spacing="2">ALWAYS-ON MAC · keepty daemon</text>
  <rect x="350" y="72" width="170" height="70" rx="10" fill="#111827" stroke="#374151"/>
  <text x="435" y="100" text-anchor="middle" fill="#e5e7eb" font-weight="600">PTY terminals</text>
  <text x="435" y="120" text-anchor="middle" fill="#9ca3af" font-size="12">named · scrollback · outlive clients</text>
  <rect x="540" y="72" width="170" height="70" rx="10" fill="#111827" stroke="#374151"/>
  <text x="625" y="100" text-anchor="middle" fill="#e5e7eb" font-weight="600">workspaces</text>
  <text x="625" y="120" text-anchor="middle" fill="#9ca3af" font-size="12">git worktree or folder</text>
  <rect x="350" y="160" width="170" height="70" rx="10" fill="#111827" stroke="#374151"/>
  <text x="435" y="188" text-anchor="middle" fill="#e5e7eb" font-weight="600">hooks → status</text>
  <text x="435" y="208" text-anchor="middle" fill="#9ca3af" font-size="12">working · needs input · idle</text>
  <rect x="540" y="160" width="170" height="70" rx="10" fill="#111827" stroke="#374151"/>
  <text x="625" y="188" text-anchor="middle" fill="#e5e7eb" font-weight="600">HTTP · SSE · WebSocket</text>
  <text x="625" y="208" text-anchor="middle" fill="#9ca3af" font-size="12">token off loopback</text>
  <!-- agents inside the host -->
  <rect x="350" y="244" width="360" height="18" rx="4" fill="transparent"/>
  <text x="530" y="257" text-anchor="middle" fill="#6b7280" font-size="12">claude · codex · zsh run inside the terminals</text>
  <!-- clients -->
  <rect x="40" y="60" width="200" height="60" rx="10" fill="#181b22" stroke="#262a33"/>
  <text x="140" y="85" text-anchor="middle" fill="#e5e7eb" font-weight="600">another Mac</text>
  <text x="140" y="105" text-anchor="middle" fill="#9ca3af" font-size="12">keepty attach · ls · new</text>
  <rect x="40" y="170" width="200" height="60" rx="10" fill="#181b22" stroke="#262a33"/>
  <text x="140" y="195" text-anchor="middle" fill="#e5e7eb" font-weight="600">phone / browser</text>
  <text x="140" y="215" text-anchor="middle" fill="#9ca3af" font-size="12">xterm.js web app (PWA)</text>
  <line x1="240" y1="90" x2="330" y2="110" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="240" y1="200" x2="330" y2="180" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="285" y="138" text-anchor="middle" fill="#64748b" font-size="11">Tailscale</text>
  <!-- right: what stays outside -->
  <rect x="760" y="60" width="120" height="60" rx="10" fill="#181b22" stroke="#262a33"/>
  <text x="820" y="85" text-anchor="middle" fill="#e5e7eb" font-weight="600" font-size="13">Remote Control</text>
  <text x="820" y="105" text-anchor="middle" fill="#9ca3af" font-size="11">Claude app</text>
  <rect x="760" y="170" width="120" height="60" rx="10" fill="#181b22" stroke="#262a33"/>
  <text x="820" y="195" text-anchor="middle" fill="#e5e7eb" font-weight="600" font-size="13">ChatGPT app</text>
  <text x="820" y="215" text-anchor="middle" fill="#9ca3af" font-size="11">codex remote-control</text>
  <text x="820" y="255" text-anchor="middle" fill="#6b7280" font-size="11">long chats stay in the vendors' apps</text>
</svg>

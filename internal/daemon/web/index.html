<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<title>keepty</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.min.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header id="top">
  <button id="back" class="icon" data-i18n-title="back" hidden>‹</button>
  <h1><img src="icon.svg" alt="" width="20" height="20" style="vertical-align:-4px;margin-right:6px">keepty</h1>
  <span id="summary" class="summary"></span>
  <span class="spacer"></span>
  <span id="conn" class="chip">connecting</span>
  <button id="bell" class="icon" data-i18n-title="btn.bell">🔕</button>
  <button id="sound" class="icon" data-i18n-title="btn.sound">🔇</button>
  <button id="newbtn" class="primary">+ new</button>
</header>
<div id="app">
  <aside id="side">
    <input id="filter" data-i18n-ph="filter.ph" autocomplete="off" spellcheck="false">
    <div id="list"></div>
    <div class="hint"><kbd>⌥1-9</kbd> <span data-i18n="hint.switch"></span> <kbd>⌥N</kbd> <span data-i18n="hint.next"></span> <kbd>⌥S</kbd> <span data-i18n="hint.split"></span> <kbd>⌥W</kbd> <span data-i18n="hint.close"></span> <kbd>⌥M</kbd> <span data-i18n="hint.max"></span> <kbd>⌥F</kbd> <span data-i18n="hint.find"></span></div>
  </aside>
  <section id="main">
    <div id="panes" class="n0"></div>
    <div id="empty" class="empty" data-i18n="empty.main"></div>
    <div id="keys" hidden>
      <button data-seq="\u001b">esc</button>
      <button data-seq="\t">tab</button>
      <button id="ctrl">ctrl</button>
      <button data-seq="\u0003">^C</button>
      <button data-seq="\u001b[A">↑</button>
      <button data-seq="\u001b[B">↓</button>
      <button data-seq="\u001b[D">←</button>
      <button data-seq="\u001b[C">→</button>
      <button data-seq="\r">enter</button>
      <button data-seq="y\r">y⏎</button>
    </div>
  </section>
</div>
<div id="toasts"></div>
<dialog id="newdlg">
  <div class="tabs"><b data-i18n="dlg.title"></b><span class="spacer"></span><button type="button" class="icon" id="dlgclose">×</button></div>
  <form id="newform" class="form">
    <label><span data-i18n="dlg.workspace"></span>
      <select name="workspace" id="wssel"></select>
    </label>
    <div id="wsnew" class="form sub">
      <label><span data-i18n="dlg.wsname"></span> <input name="wsname" data-i18n-ph="dlg.wsname.ph" pattern="[A-Za-z0-9][A-Za-z0-9._-]*" autocomplete="off"></label>
      <label><span data-i18n="dlg.where"></span> <select name="source" id="srcsel"></select></label>
      <label id="pathrow" hidden><span data-i18n="dlg.path"></span> <input name="path" placeholder="~/workspace/foo" autocomplete="off"></label>
      <label id="branchrow"><span data-i18n="dlg.branch"></span> <input name="branch" data-i18n-ph="dlg.branch.ph" autocomplete="off"></label>
    </div>
    <label><span data-i18n="dlg.agent"></span> <div class="seg" id="agentseg"></div></label>
    <label id="modelrow"><span data-i18n="dlg.model"></span> <input name="model" list="modellist" data-i18n-ph="dlg.model.ph" autocomplete="off"><datalist id="modellist"></datalist></label>
    <label><span data-i18n="dlg.name"></span> <input name="name" data-i18n-ph="dlg.name.ph" pattern="[A-Za-z0-9][A-Za-z0-9._-]*" autocomplete="off"></label>
    <button class="primary" data-i18n="dlg.start"></button>
  </form>
</dialog>
<dialog id="askdlg">
  <form id="askform" class="form">
    <div class="tabs"><b id="asktitle"></b><span class="spacer"></span><button type="button" class="icon" id="askcancel">×</button></div>
    <input id="askinput" list="asklist" autocomplete="off"><datalist id="asklist"></datalist>
    <button class="primary" data-i18n="ask.ok"></button>
  </form>
</dialog>
<dialog id="handoffdlg">
  <div class="tabs"><b id="hotitle"></b><span class="spacer"></span><button type="button" class="icon" id="hoclose">×</button></div>
  <form id="hoform" class="form">
    <label><span data-i18n="ho.to"></span> <div class="seg" id="hoseg"></div></label>
    <label><span data-i18n="ho.model"></span> <input name="model" list="homodels" data-i18n-ph="dlg.model.ph" autocomplete="off"><datalist id="homodels"></datalist></label>
    <label class="check"><input type="checkbox" name="close"> <span data-i18n="ho.close"></span></label>
    <p class="note" data-i18n="ho.note"></p>
    <button class="primary" data-i18n="ho.submit"></button>
  </form>
</dialog>
<script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@xterm/addon-search@0.15.0/lib/addon-search.min.js"></script>
<script src="common.js"></script>
<script src="app.js"></script>
</body>
</html>

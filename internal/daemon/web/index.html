<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<title>fleet</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.min.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header id="top">
  <button id="back" class="icon" title="목록" hidden>‹</button>
  <h1>fleet</h1>
  <span id="summary" class="summary"></span>
  <span class="spacer"></span>
  <span id="conn" class="chip">connecting</span>
  <button id="bell" class="icon" title="데스크톱 알림">🔕</button>
  <button id="sound" class="icon" title="소리">🔇</button>
  <button id="newbtn" class="primary">+ new</button>
</header>
<div id="app">
  <aside id="side">
    <input id="filter" placeholder="이름 필터, 두 글자부터는 출력도 검색" autocomplete="off" spellcheck="false">
    <div id="list"></div>
    <div class="hint"><kbd>⌥1-9</kbd> 전환 <kbd>⌥N</kbd> 다음 입력 대기 <kbd>⌥S</kbd> 분할 <kbd>⌥W</kbd> 닫기 <kbd>⌥M</kbd> 최대화 <kbd>⌥F</kbd> 찾기</div>
  </aside>
  <section id="main">
    <div id="panes" class="n0"></div>
    <div id="empty" class="empty">왼쪽에서 터미널을 고르거나 + new 로 만들어.</div>
    <div id="keys" hidden>
      <button data-seq="\u001b">esc</button>
      <button data-seq="\t">tab</button>
      <button id="ctrl">ctrl</button>
      <button data-seq="\u0003">^C</button>
      <button data-seq="\u001b[A">↑</button>
      <button data-seq="\u001b[B">↓</button>
      <button data-seq="\u001b[D">←</button>
      <button data-seq="\u001b[C">→</button>
      <button data-seq="\r">enter</button>
      <button data-seq="y\r">y⏎</button>
    </div>
  </section>
</div>
<div id="toasts"></div>
<dialog id="newdlg">
  <div class="tabs"><b>새 터미널</b><span class="spacer"></span><button type="button" class="icon" id="dlgclose">×</button></div>
  <form id="newform" class="form">
    <label>워크스페이스
      <select name="workspace" id="wssel"></select>
    </label>
    <div id="wsnew" class="form sub">
      <label>워크스페이스 이름 <input name="wsname" placeholder="예: fix-login" pattern="[A-Za-z0-9][A-Za-z0-9._-]*" autocomplete="off"></label>
      <label>어디서 <select name="source" id="srcsel"></select></label>
      <label id="pathrow" hidden>폴더 경로 <input name="path" placeholder="~/workspace/foo" autocomplete="off"></label>
      <label id="branchrow">브랜치 (선택) <input name="branch" placeholder="기본: 워크스페이스 이름" autocomplete="off"></label>
    </div>
    <label>에이전트 <div class="seg" id="agentseg"></div></label>
    <label id="modelrow">모델 (선택) <input name="model" list="modellist" placeholder="기본 모델" autocomplete="off"><datalist id="modellist"></datalist></label>
    <label>터미널 이름 (선택) <input name="name" placeholder="자동: 워크스페이스-에이전트" pattern="[A-Za-z0-9][A-Za-z0-9._-]*" autocomplete="off"></label>
    <button class="primary">시작</button>
  </form>
</dialog>
<dialog id="askdlg">
  <form id="askform" class="form">
    <div class="tabs"><b id="asktitle"></b><span class="spacer"></span><button type="button" class="icon" id="askcancel">×</button></div>
    <input id="askinput" list="asklist" autocomplete="off"><datalist id="asklist"></datalist>
    <button class="primary">확인</button>
  </form>
</dialog>
<dialog id="handoffdlg">
  <div class="tabs"><b id="hotitle">넘겨주기</b><span class="spacer"></span><button type="button" class="icon" id="hoclose">×</button></div>
  <form id="hoform" class="form">
    <label>받을 에이전트 <div class="seg" id="hoseg"></div></label>
    <label>모델 (선택) <input name="model" list="homodels" placeholder="기본 모델" autocomplete="off"><datalist id="homodels"></datalist></label>
    <label class="check"><input type="checkbox" name="close"> 넘긴 뒤 이전 터미널 닫기</label>
    <p class="note">이전 터미널의 마지막 출력과 git 상태를 <code>.fleet/handoff-*.md</code>로 남기고, 새 에이전트가 그 파일을 읽고 이어가도록 첫 프롬프트를 넣어 시작해.</p>
    <button class="primary">넘기기</button>
  </form>
</dialog>
<script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@xterm/addon-search@0.15.0/lib/addon-search.min.js"></script>
<script src="common.js"></script>
<script src="app.js"></script>
</body>
</html>

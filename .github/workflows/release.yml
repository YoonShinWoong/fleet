name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - name: build binaries
        run: |
          mkdir -p dist
          for t in darwin/arm64 darwin/amd64 linux/arm64 linux/amd64; do
            GOOS=${t%/*} GOARCH=${t#*/} CGO_ENABLED=0 go build -trimpath \
              -ldflags "-s -w -X github.com/YoonShinWoong/keepty/internal/version.Version=${GITHUB_REF_NAME}" \
              -o "dist/keepty-${t%/*}-${t#*/}" ./cmd/keepty
          done
          (cd dist && shasum -a 256 keepty-* > SHA256SUMS)
      - name: create release from CHANGELOG
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(awk -v v="$GITHUB_REF_NAME" '$0 ~ "^## "v"( |$)"{f=1; next} /^## /{f=0} f' CHANGELOG.md)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          elif [ -n "$notes" ]; then
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "$notes" dist/*
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes dist/*
          fi

  desktop:
    runs-on: macos-latest
    needs: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: build desktop app
        working-directory: apps/desktop
        run: |
          npm ci
          npx tauri build --ci
      - name: upload dmg to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dmg=$(ls apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg | head -1)
          cp "$dmg" "keepty-desktop-${GITHUB_REF_NAME}-macos-arm64.dmg"
          gh release upload "$GITHUB_REF_NAME" "keepty-desktop-${GITHUB_REF_NAME}-macos-arm64.dmg" --clobber
